<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Vault - Private</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;padding-bottom:80px}
header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
#uploadBtn{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}
#search{width:94%;margin:10px 3%;padding:12px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155}
.card img{width:100%;height:140px;object-fit:cover;display:block}
.actions{display:flex;gap:4px;padding:6px}
.btn{flex:1;padding:7px 2px;font-size:10px;border:none;border-radius:6px;font-weight:bold}
.btn-view{background:#334155;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-save{background:#10b981;color:#fff}
#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #334155;z-index:10}
.b-nav{background:none;border:none;color:#94a3b8;font-size:11px;text-align:center}
.b-nav b{display:block;font-size:18px}
#viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:15px;z-index:50}
#viewer img{max-width:100%;max-height:45%;border-radius:10px}
#viewerBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:340px}
.sbtn{padding:13px 16px;border:none;border-radius:25px;font-weight:bold;font-size:13px;min-width:85px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:20px;font-size:13px;display:none;z-index:60;font-weight:bold}
#lock{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;text-align:center}
#lockBox{background:#1e293b;padding:25px;border-radius:20px;width:100%;max-width:320px;border:1px solid #334155}
#lockBox h2{margin-bottom:15px;font-size:22px}
#lockBox input{width:100%;padding:14px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;font-size:18px;text-align:center;margin:8px 0}
#lockBox button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}
#btnUnlock{background:#3b82f6;color:#fff}
#btnSet{background:#10b981;color:#fff}
#lockMsg{color:#ef4444;font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>

<div id="lock">
<div id="lockBox">
<h2 id="lockTitle">🔒 MY PRIVATE VAULT</h2>
<p id="lockSub" style="color:#94a3b8;font-size:13px;margin-bottom:15px">Enter password to see pictures</p>
<input type="password" id="passInput" placeholder="Enter Password">
<input type="password" id="passInput2" placeholder="Confirm Password" style="display:none">
<div id="lockMsg"></div>
<button id="btnUnlock" onclick="doUnlock()">UNLOCK</button>
<button id="btnSet" onclick="doSet()" style="display:none">SET PASSWORD</button>
<p onclick="resetPass()" style="margin-top:18px;font-size:13px;color:#3b82f6;text-decoration:underline;cursor:pointer">Forgot password? Reset here</p>
<p style="margin-top:10px;font-size:11px;color:#64748b">First time? Create a password</p>
</div>
</div>

<header><span>🔒 PRIVATE VAULT</span><div><button onclick="lockNow()" style="background:#334155;color:#fff;border:none;padding:8px 12px;border-radius:15px;font-size:11px;margin-right:5px">🔒 Lock</button><button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button></div></header>
<input type="file" id="fileInput" multiple accept="image/*" style="display:none">
<input id="search" placeholder="Search..." oninput="showFiles()">
<div id="list" class="grid"></div>

<div id="viewer">
<img id="vImg" src="">
<p id="vName" style="margin-top:8px;font-size:11px;color:#aaa"></p>
<div id="viewerBar">
<button class="sbtn" style="background:#25D366;color:#fff" onclick="shareWA(curId)">WhatsApp</button>
<button class="sbtn" style="background:#1877F2;color:#fff" onclick="shareFB(curId)">Facebook</button>
<button class="sbtn" style="background:#fff;color:#000" onclick="shareTT(curId)">TikTok</button>
<button class="sbtn" style="background:#10b981;color:#fff" onclick="savePic(curId)">Save</button>
<button class="sbtn" style="background:#334155;color:#fff" onclick="closeV()">Close</button>
</div>
<p style="margin-top:12px;font-size:10px;color:#666;text-align:center">WhatsApp sharing: If direct share doesn't open, tap Save first then share from Gallery</p>
</div>

<div id="toast"></div>
<div id="bottom">
<button class="b-nav" onclick="document.getElementById('fileInput').click()"><b>📤</b>Upload</button>
<button class="b-nav" onclick="printPDF()"><b>🖨️</b>PDF</button>
<button class="b-nav" onclick="resetPass()"><b>⚙️</b>Reset Pass</button>
</div>

<script>
// AUTO RESET IF YOU OPEN WITH ?reset=1
if(window.location.href.includes('reset')){
localStorage.removeItem('vaultPass');

window.location.href = window.location.href.split('?')[0];

let db,files=[],curId=null;
let req=indexedDB.open('VaultDB',1);
req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};
req.onsuccess=e=>{db=e.target.result;load()};
function load(){let tx=db.transaction('files','readonly');let r=tx.objectStore('files').getAll();r.onsuccess=()=>{files=r.result.sort((a,b)=>b.time-a.time);showFiles()}}
function saveObj(o){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(o);tx.oncomplete=()=>load()}
function toBase(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
function compress(d,maxW){return new Promise(res=>{let i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>maxW){h=h*maxW/w;w=maxW}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(i,0,0,w,h);res(cv.toDataURL('image/jpeg',0.75))};i.src=d})}
document.getElementById('fileInput').addEventListener('change',async e=>{for(let f of e.target.files){let b=await toBase(f);let c=await compress(b,1200);saveObj({id:Date.now()+Math.random()+'',name:f.name,time:Date.now(),data:c})}toast('Saved!')});
function showFiles(){let q=document.getElementById('search').value.toLowerCase();let filtered=files.filter(f=>!q||f.name.toLowerCase().includes(q));let list=document.getElementById('list');if(filtered.length==0){list.innerHTML='<div style="grid-column:1/3;text-align:center;padding:40px;color:#64748b">No pictures yet<br>Tap + ADD to add</div>';return}list.innerHTML=filtered.map(f=>{return `<div class="card"><img src="${f.data}" onclick="openV('${f.id}')"><div class="actions"><button class="btn btn-view" onclick="openV('${f.id}')">View</button><button class="btn btn-wa" onclick="shareWA('${f.id}')">WA</button><button class="btn btn-save" onclick="savePic('${f.id}')">Save</button></div></div>`}).join('')}
function openV(id){let f=files.find(x=>x.id==id);curId=id;document.getElementById('vImg').src=f.data;document.getElementById('vName').textContent=f.name;document.getElementById('viewer').style.display='flex'}
function closeV(){document.getElementById('viewer').style.display='none'}
function dataURLtoFile(dataurl, filename){let arr=dataurl.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]),n=bstr.length,u8arr=new Uint8Array(n);while(n--){u8arr[n]=bstr.charCodeAt(n);}return new File([u8arr],filename,{type:mime});}
async function shareWA(id){let f=files.find(x=>x.id==id);try{let file=dataURLtoFile(f.data,f.name);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return;}}catch(e){}savePic(id)}
async function shareFB(id){shareWA(id)}async function shareTT(id){shareWA(id)}
function savePic(id){let f=files.find(x=>x.id==id);let a=document.createElement('a');a.href=f.data;a.download=f.name;document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Saved to Downloads');}
function printPDF(){if(files.length==0)return toast('No pictures');let w=window.open();let html=files.map(f=>`<div style="page-break-after:always;text-align:center"><p>${f.name}</p><img src="${f.data}" style="max-width:100%"></div>`).join('');w.document.write(html+`<br><div style="text-align:center"><button onclick="window.print()" style="padding:15px 30px;background:orange;border:none;border-radius:10px;font-weight:bold">🖨️ Print / Save as PDF</button></div>`)}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
