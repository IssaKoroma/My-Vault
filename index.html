<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Vault</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding-bottom:80px}header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0} #uploadBtn{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}#search{width:94%;margin:10px 3%;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;position:relative}.card img{width:100%;height:140px;object-fit:cover}.actions{display:flex;gap:3px;padding:5px}.btn{flex:1;padding:6px;font-size:10px;border:none;border-radius:6px;font-weight:bold}.btn-view{background:#334155;color:#fff}.btn-wa{background:#25D366;color:#fff}.btn-save{background:#10b981;color:#fff}.btn-del{background:#ef4444;color:#fff}#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #334155}.b-nav{background:none;border:none;color:#94a3b8;font-size:10px;text-align:center}.b-nav b{display:block;font-size:16px}#viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:15px;z-index:50}#viewer img{max-width:100%;max-height:50%;border-radius:10px}#viewerBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}.sbtn{padding:11px 14px;border:none;border-radius:20px;font-weight:bold;font-size:12px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:20px;font-size:13px;display:none;z-index:60}</style></head><body>
<header><span>🔒 MY VAULT - NO PASSWORD</span><button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button></header>
<input type="file" id="fileInput" multiple accept="image/*" style="display:none"><input id="search" placeholder="Search..." oninput="showFiles()"><div id="list" class="grid"></div>
<div id="viewer"><img id="vImg" src=""><p id="vName" style="margin-top:8px;font-size:11px"></p><div id="viewerBar"><button class="sbtn" style="background:#10b981;color:#fff" onclick="savePic(curId)">Save</button><button class="sbtn" style="background:#25D366;color:#fff" onclick="shareWA(curId)">WhatsApp</button><button class="sbtn" style="background:#1877F2;color:#fff" onclick="shareFB(curId)">Facebook</button><button class="sbtn" style="background:#000;color:#fff;border:1px solid #333" onclick="shareAll(curId)">TikTok</button><button class="sbtn" style="background:#ef4444;color:#fff" onclick="delOne(curId)">Delete</button><button class="sbtn" style="background:#334155;color:#fff" onclick="closeV()">Close</button></div></div><div id="toast"></div>
<div id="bottom"><button class="b-nav" onclick="document.getElementById('fileInput').click()"><b>📤</b>Upload</button><button class="b-nav" id="selBtn" onclick="toggleSel()"><b>☑️</b><span id="selTxt">Select</span></button><button class="b-nav" id="delBtn" onclick="delSel()" style="display:none"><b>🗑️</b>Delete</button><button class="b-nav" id="shareBtn" onclick="shareSel()" style="display:none"><b>💬</b>Share</button><button class="b-nav" onclick="printPDF()"><b>🖨️</b>PDF</button></div>
<script>
let db,files=[],curId=null,selMode=false,selSet=new Set();
let req=indexedDB.open('VaultDB',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};req.onsuccess=e=>{db=e.target.result;load()};function load(){let tx=db.transaction('files','readonly');let r=tx.objectStore('files').getAll();r.onsuccess=()=>{files=r.result.sort((a,b)=>b.time-a.time);showFiles()}}function saveObj(o){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(o);tx.oncomplete=()=>load()}function delObj(id){let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>load()}
document.getElementById('fileInput').addEventListener('change',async e=>{for(let f of e.target.files){let b=await toBase(f);let c=await compress(b,1000);saveObj({id:Date.now()+Math.random()+'',name:f.name,time:Date.now(),data:c})}toast('Saved!')});function toBase(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}function compress(d,maxW){return new Promise(res=>{let i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>maxW){h=h*maxW/w;w=maxW}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(i,0,0,w,h);res(cv.toDataURL('image/jpeg',0.75))};i.src=d})}
function showFiles(){let q=document.getElementById('search').value.toLowerCase();let filtered=files.filter(f=>!q||f.name.toLowerCase().includes(q));let list=document.getElementById('list');if(filtered.length==0){list.innerHTML='<div style="text-align:center;padding:40px;color:#64748b">No pictures<br>Tap + ADD</div>';return}list.innerHTML=filtered.map(f=>{let sel=selSet.has(f.id);return `<div class="card" onclick="${selMode?`tog('${f.id}')`:`openV('${f.id}')`}"><img src="${f.data}"><div class="actions"><button class="btn btn-view" onclick="event.stopPropagation();openV('${f.id}')">View</button><button class="btn btn-wa" onclick="event.stopPropagation();shareWA('${f.id}')">WA</button><button class="btn btn-save" onclick="event.stopPropagation();savePic('${f.id}')">Save</button><button class="btn btn-del" onclick="event.stopPropagation();delOne('${f.id}')">Del</button></div></div>`}).join('')}
function openV(id){let f=files.find(x=>x.id==id);curId=id;document.getElementById('vImg').src=f.data;document.getElementById('vName').textContent=f.name;document.getElementById('viewer').style.display='flex'}function closeV(){document.getElementById('viewer').style.display='none'}function toggleSel(){selMode=!selMode;selSet.clear();document.getElementById('selBtn').innerHTML=selMode?'<b>✕</b><span>Cancel</span>':'<b>☑️</b><span>Select</span>';document.getElementById('delBtn').style.display=selMode?'block':'none';document.getElementById('shareBtn').style.display=selMode?'block':'none';showFiles()}function tog(id){if(selSet.has(id))selSet.delete(id);else selSet.add(id);showFiles()}function delOne(id){if(confirm('Delete?')){delObj(id);closeV();toast('Deleted')}}function delSel(){if(selSet.size==0)return toast('Select first');if(confirm('Delete '+selSet.size+'?')){[...selSet].forEach(id=>delObj(id));selSet.clear();toggleSel();toast('Deleted')}}
function dataURLtoFile(dataurl, filename){let arr=dataurl.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]),n=bstr.length,u8arr=new Uint8Array(n);while(n--){u8arr[n]=bstr.charCodeAt(n);}return new File([u8arr],filename,{type:mime});}
async function shareWA(id){let f=files.find(x=>x.id==id);try{let file=dataURLtoFile(f.data,f.name);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});toast('Choose WhatsApp!');return;}}catch(e){}savePic(id);}async function shareFB(id){let f=files.find(x=>x.id==id);try{let file=dataURLtoFile(f.data,f.name);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return;}}catch(e){}savePic(id);}async function shareAll(id){let f=files.find(x=>x.id==id);try{let file=dataURLtoFile(f.data,f.name);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return;}}catch(e){}savePic(id);}async function shareSel(){if(selSet.size==0)return toast('Select first');try{let arr=[];for(let id of selSet){let ff=files.find(x=>x.id==id);arr.push(dataURLtoFile(ff.data,ff.name))}if(navigator.canShare&&navigator.canShare({files:arr})){await navigator.share({files:arr,title:'My Vault'});return;}}catch(e){}toast('Select 1 pic');}
function savePic(id){let f=files.find(x=>x.id==id);let w=window.open();w.document.write(`<body style="margin:0;background:#000;color:#fff;text-align:center"><img src="${f.data}" style="max-width:100%;max-height:70vh"><p>Long press -> Save image</p><a href="${f.data}" download="${f.name}" style="background:#10b981;color:#fff;padding:12px 20px;border-radius:20px;text-decoration:none;display:inline-block">Download</a></body>`)}
function printPDF(){if(files.length==0)return toast('No pictures');let w=window.open();let html=files.map(f=>`<div style="page-break-after:always"><p>${f.name}</p><img src="${f.data}" style="max-width:100%"></div>`).join('');w.document.write(html+`<br><button onclick="window.print()" style="padding:15px;background:orange;border:none;border-radius:10px;font-weight:bold">Print PDF</button>`)}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
</script></body></html>
