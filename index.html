<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>My Vault - All Features</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;min-height:100vh;padding-bottom:95px}
header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #334155}
#uploadBtn{background:#3b82f6;color:white;border:none;padding:9px 16px;border-radius:25px;font-weight:bold;font-size:13px}
#search{width:calc(100% - 30px);margin:10px 15px;padding:11px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:white;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#1e293b;border-radius:14px;overflow:hidden;border:1px solid #334155;position:relative}
.card.selectMode{border:2px solid #3b82f6}
.card img{width:100%;height:145px;object-fit:cover;display:block}
.checkBox{position:absolute;top:6px;left:6px;width:22px;height:22px;background:white;border-radius:50%;display:none;justify-content:center;align-items:center;font-weight:bold;color:black;border:2px solid #334155;font-size:12px}
.checkBox.show{display:flex}
.checkBox.checked{background:#3b82f6;color:white;border-color:#3b82f6}
.info{padding:6px}
.name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#94a3b8}
.actions{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.btn{padding:6px 3px;font-size:10px;border:none;border-radius:6px;font-weight:bold;flex:1}
.btn-view{background:#334155;color:white}
.btn-whatsapp{background:#25D366;color:white}
.btn-down{background:#10b981;color:white}
.btn-del{background:#ef4444;color:white}
#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:8px;border-top:1px solid #334155;z-index:10}
.b-nav{color:#94a3b8;font-size:10px;text-align:center;background:none;border:none;padding:4px 6px}
.b-nav b{font-size:15px;display:block}
.b-nav.active{color:#ef4444}
#fileInput{display:none}
#lockScreen{position:fixed;left:0;top:0;width:100%;height:100%;background:#0f172a;z-index:200;display:flex;justify-content:center;align-items:center;padding:20px}
.lockBox{background:#1e293b;padding:30px;border-radius:20px;width:100%;max-width:350px;text-align:center;border:1px solid #334155}
.lockBox input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;text-align:center}
.lockBtn{width:100%;padding:14px;background:#3b82f6;color:white;border:none;border-radius:12px;font-weight:bold;margin-top:10px}
#viewer{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.97);display:none;z-index:150;justify-content:center;align-items:center;flex-direction:column;padding:12px}
#viewer img{max-width:100%;max-height:45%;object-fit:contain;border-radius:8px}
#viewerBar{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;justify-content:center;width:100%}
.shareBtn{padding:9px 10px;border:none;border-radius:18px;font-weight:bold;font-size:11px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:white;color:black;padding:12px 18px;border-radius:25px;font-size:12px;display:none;z-index:300;text-align:center;max-width:90%}
</style>
</head>
<body>
<div id="lockScreen">
<div class="lockBox" id="setPassBox" style="display:none">
<h2>🔒 Set Password</h2>
<input id="newPass" type="password" placeholder="Create password">
<input id="confirmPass" type="password" placeholder="Confirm">
<button class="lockBtn" onclick="setPassword()">Lock My Vault</button>
</div>
<div class="lockBox" id="enterPassBox" style="display:none">
<h2>🔒 Vault Locked</h2>
<input id="enterPass" type="password" placeholder="Enter password">
<button class="lockBtn" onclick="unlockVault()">Unlock</button>
</div>
</div>

<header>
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px">🔒 MY VAULT</span><button onclick="lockVault()" style="background:#334155;color:white;border:none;padding:5px 10px;border-radius:15px;font-size:10px">🔒 Lock</button></div>
<button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button>
</header>

<input type="file" id="fileInput" multiple accept="image/*">
<input id="search" placeholder="Search..." oninput="render()">

<div id="list" class="grid"></div>

<div id="viewer">
<img id="viewerImg" src="">
<p id="viewerName" style="margin-top:6px;font-size:11px;color:white"></p>
<div id="viewerBar">
<button onclick="saveGallery(currentViewId)" class="shareBtn" style="background:#10b981;color:white">💾 Save</button>
<button onclick="shareWhatsApp(currentViewId)" class="shareBtn" style="background:#25D366;color:white">WhatsApp</button>
<button onclick="shareFacebook(currentViewId)" class="shareBtn" style="background:#1877F2;color:white">Facebook</button>
<button onclick="shareAny(currentViewId)" class="shareBtn" style="background:#000;color:white">TikTok / More</button>
<button onclick="deleteOne(currentViewId)" class="shareBtn" style="background:#ef4444;color:white">🗑️ Delete</button>
<button onclick="closeViewer()" class="shareBtn" style="background:#334155;color:white">✕ Close</button>
</div>
</div>

<div id="toast"></div>

<div id="bottom">
<button class="b-nav" onclick="document.getElementById('fileInput').click()"><b>📤</b>Upload</button>
<button class="b-nav" id="selectBtn" onclick="toggleSelectMode()"><b>☑️</b><span id="selectText">Select</span></button>
<button class="b-nav" id="deleteBtn" onclick="deleteSelected()" style="display:none"><b>🗑️</b><span id="deleteText">Del (0)</span></button>
<button class="b-nav" id="shareBtnBottom" onclick="shareSelected()" style="display:none"><b>💬</b><span id="shareText">Share (0)</span></button>
<button class="b-nav" onclick="makeAllPDF()"><b>🖨️</b>PDF</button>
</div>

<script>
function getHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h;}return h.toString();}
function checkLock(){let p=localStorage.getItem('vault_pass_hash');if(!p){document.getElementById('lockScreen').style.display='flex';document.getElementById('setPassBox').style.display='block';document.getElementById('enterPassBox').style.display='none';}else{document.getElementById('lockScreen').style.display='flex';document.getElementById('setPassBox').style.display='none';document.getElementById('enterPassBox').style.display='block';}}
function setPassword(){let p=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value;if(p.length<4)return showToast('4+ chars');if(p!==c)return showToast('Not match');localStorage.setItem('vault_pass_hash',getHash(p));document.getElementById('lockScreen').style.display='none';}
function unlockVault(){let p=document.getElementById('enterPass').value;if(getHash(p)===localStorage.getItem('vault_pass_hash')){document.getElementById('lockScreen').style.display='none';document.getElementById('enterPass').value='';}else{showToast('Wrong password');}}
function lockVault(){document.getElementById('lockScreen').style.display='flex';document.getElementById('setPassBox').style.display='none';document.getElementById('enterPassBox').style.display='block';}
checkLock();

let db, files=[], currentViewId=null, selectMode=false, selectedIds=new Set();
let request=indexedDB.open('MyVaultDB',2);
request.onupgradeneeded=e=>{db=e.target.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});};
request.onsuccess=e=>{db=e.target.result; loadFiles();};
function loadFiles(){let tx=db.transaction('files','readonly');let req=tx.objectStore('files').getAll();req.onsuccess=()=>{files=req.result.sort((a,b)=>b.created-a.created); render();};}
function saveFile(obj){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(obj);tx.oncomplete=()=>loadFiles();}
function deleteFile(id){let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>loadFiles();}

document.getElementById('fileInput').addEventListener('change',async e=>{
  for(let file of e.target.files){
    let data=await toBase64(file);
    data=await compressImage(data, 1024);
    let obj={id:Date.now()+Math.random().toString(), name:file.name, type:file.type, created:Date.now(), date:new Date().toLocaleString(), data:data};
    saveFile(obj);
  }
  showToast('Saved!');
});
function toBase64(f){return new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);})}
function compressImage(dataUrl, maxW){return new Promise(res=>{let img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=(maxW/w)*h;w=maxW;}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.75));};img.src=dataUrl;});}

function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=document.getElementById('list');
  let filtered=files.filter(f=>!q||f.name.toLowerCase().includes(q));
  if(filtered.length==0){list.innerHTML='<div style="text-align:center;padding:50px;color:#64748b">No pictures<br>Click + ADD</div>';return;}
  list.innerHTML=filtered.map(f=>{
    let isSel=selectedIds.has(f.id);
    return `
    <div class="card ${selectMode?'selectMode':''}" onclick="${selectMode?`toggleSelect('${f.id}')`:`viewFile('${f.id}')`}">
      <div class="checkBox ${selectMode?'show':''} ${isSel?'checked':''}">${isSel?'✓':''}</div>
      <img src="${f.data}">
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="actions">
          ${selectMode?`<button class="btn ${isSel?'btn-del':'btn-view'}" onclick="event.stopPropagation();toggleSelect('${f.id}')">${isSel?'Selected':'Select'}</button>`:
          `<button class="btn btn-view" onclick="event.stopPropagation();viewFile('${f.id}')">View<
