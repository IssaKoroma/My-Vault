<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>My Vault - Password Protected</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;min-height:100vh;padding-bottom:90px}
header{background:#1e293b;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #334155}
#uploadBtn{background:#3b82f6;color:white;border:none;padding:10px 18px;border-radius:25px;font-weight:bold}
#search{width:calc(100% - 30px);margin:12px 15px;padding:12px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:white;outline:none}
.tabs{display:flex;gap:8px;padding:0 15px;overflow-x:auto}
.tab{padding:8px 14px;background:#1e293b;border-radius:20px;font-size:13px;white-space:nowrap;border:1px solid #334155}
.tab.active{background:#3b82f6;border-color:#3b82f6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#1e293b;border-radius:14px;overflow:hidden;border:1px solid #334155}
.card img{width:100%;height:160px;object-fit:cover}
.info{padding:10px}
.name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:10px;color:#94a3b8}
.actions{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;padding:8px;font-size:12px;border:none;border-radius:8px;font-weight:bold}
.btn-view{background:#334155;color:white}
.btn-pdf{background:#f59e0b;color:black}
.btn-down{background:#10b981;color:white}
#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #334155;z-index:10}
.b-nav{color:#94a3b8;font-size:11px;text-align:center;background:none;border:none}
#fileInput{display:none}
/* LOCK SCREEN */
#lockScreen{position:fixed;left:0;top:0;width:100%;height:100%;background:#0f172a;z-index:200;display:flex;justify-content:center;align-items:center;padding:20px}
.lockBox{background:#1e293b;padding:30px;border-radius:20px;width:100%;max-width:350px;text-align:center;border:1px solid #334155}
.lockBox h2{margin-bottom:10px}
.lockBox p{color:#94a3b8;font-size:13px;margin-bottom:20px}
.lockBox input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px;text-align:center;letter-spacing:3px}
.lockBtn{width:100%;padding:14px;background:#3b82f6;color:white;border:none;border-radius:12px;font-weight:bold;font-size:15px;margin-top:10px}
#viewer{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.97);display:none;z-index:150;justify-content:center;align-items:center;flex-direction:column;padding:15px}
#viewer img{max-width:100%;max-height:70%;object-fit:contain;border-radius:8px}
#viewerBar{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:white;color:black;padding:12px 20px;border-radius:25px;font-size:13px;display:none;z-index:300;text-align:center;max-width:90%}
</style>
</head>
<body>
<!-- PASSWORD LOCK SCREEN -->
<div id="lockScreen">
<div class="lockBox" id="setPassBox" style="display:none">
<h2>🔒 Set Your Password</h2>
<p>First time - create a password to protect your vault. Nobody can open without it.</p>
<input id="newPass" type="password" placeholder="Create password (4+ digits)">
<input id="confirmPass" type="password" placeholder="Confirm password">
<button class="lockBtn" onclick="setPassword()">Lock My Vault 🔒</button>
</div>
<div class="lockBox" id="enterPassBox" style="display:none">
<h2>🔒 Vault Locked</h2>
<p>Enter password to open your private documents & pictures</p>
<input id="enterPass" type="password" placeholder="Enter password">
<button class="lockBtn" onclick="unlockVault()">Unlock 🔓</button>
<button onclick="resetVault()" style="background:none;border:none;color:#ef4444;font-size:11px;margin-top:15px">Forgot password? Reset (will delete password only, not files)</button>
</div>
</div>

<header>
<div style="display:flex;align-items:center;gap:10px">
<span>🔒 MY VAULT</span>
<button onclick="lockVault()" style="background:#334155;color:white;border:none;padding:6px 12px;border-radius:15px;font-size:11px">🔒 Lock</button>
</div>
<button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button>
</header>

<input type="file" id="fileInput" multiple accept="image/*,application/pdf,.doc,.docx,.txt">
<input id="search" placeholder="Search..." oninput="render()">

<div class="tabs">
<button class="tab active" onclick="filter='all';render()" id="t-all">All</button>
<button class="tab" onclick="filter='image';render()" id="t-image">Pictures</button>
<button class="tab" onclick="filter='pdf';render()" id="t-pdf">PDFs</button>
</div>

<div id="list" class="grid"></div>

<div id="viewer">
<img id="viewerImg" src="">
<p id="viewerName" style="margin-top:10px;font-size:13px"></p>
<div id="viewerBar">
<button onclick="saveCurrentToGallery()" style="background:#10b981;color:white;padding:10px 16px;border:none;border-radius:20px;font-weight:bold">💾 Save to Gallery</button>
<button onclick="pdfCurrent()" style="background:#f59e0b;color:black;padding:10px 16px;border:none;border-radius:20px;font-weight:bold">📄 Save PDF</button>
<button onclick="closeViewer()" style="background:#334155;color:white;padding:10px 16px;border:none;border-radius:20px">✕ Close</button>
</div>
</div>

<div id="toast"></div>

<div id="bottom">
<button class="b-nav" onclick="changePassword()">🔑<br>Change Pass</button>
<button class="b-nav" onclick="document.getElementById('fileInput').click()">📤<br>Upload</button>
<button class="b-nav" onclick="makeAllPDF()">🖨️<br>Print All PDF</button>
</div>

<script>
// PASSWORD LOGIC
function getHash(str){ // simple hash
  let hash=0; for(let i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i); hash=hash&hash;} return hash.toString();
}
function checkLock(){
  let pass=localStorage.getItem('vault_pass_hash');
  if(!pass){
    document.getElementById('lockScreen').style.display='flex';
    document.getElementById('setPassBox').style.display='block';
    document.getElementById('enterPassBox').style.display='none';
  } else {
    document.getElementById('lockScreen').style.display='flex';
    document.getElementById('setPassBox').style.display='none';
    document.getElementById('enterPassBox').style.display='block';
  }
}
function setPassword(){
  let p=document.getElementById('newPass').value, c=document.getElementById('confirmPass').value;
  if(p.length<4) return showToast('Password must be 4+ characters');
  if(p!==c) return showToast('Passwords not match');
  localStorage.setItem('vault_pass_hash',getHash(p));
  document.getElementById('lockScreen').style.display='none';
  showToast('Vault locked! Password saved');
}
function unlockVault(){
  let p=document.getElementById('enterPass').value;
  if(getHash(p)===localStorage.getItem('vault_pass_hash')){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('enterPass').value='';
    showToast('Unlocked 🔓');
  } else {
    showToast('Wrong password! Try again');
    document.getElementById('enterPass').value='';
  }
}
function lockVault(){
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('setPassBox').style.display='none';
  document.getElementById('enterPassBox').style.display='block';
  checkLock();
}
function changePassword(){
  let oldP=prompt('Enter old password:');
  if(getHash(oldP)!==localStorage.getItem('vault_pass_hash')) return showToast('Wrong old password');
  let newP=prompt('Enter new password (4+ chars):');
  if(!newP||newP.length<4) return showToast('Too short');
  localStorage.setItem('vault_pass_hash',getHash(newP));
  showToast('Password changed!');
}
function resetVault(){
  if(confirm('Reset password? Your files will stay safe, only password will be removed.')){
    localStorage.removeItem('vault_pass_hash');
    checkLock();
    showToast('Password reset - set new password');
  }
}
checkLock();

// VAULT LOGIC
let filter='all';
let files=JSON.parse(localStorage.getItem('vault_files')||'[]');
let currentViewId=null;
function saveStore(){localStorage.setItem('vault_files',JSON.stringify(files)); render();}
document.getElementById('fileInput').addEventListener('change',async e=>{
  for(let file of e.target.files){
    let data=await toBase64(file);
    files.unshift({id:Date.now()+Math.random().toString(), name:file.name, type:file.type||'image/jpeg', size:file.size, date:new Date().toLocaleString(), data:data});
  }
  saveStore(); showToast('Saved to locked vault!');
});
function toBase64(file){return new Promise(r=>{let reader=new FileReader(); reader.onload=()=>r(reader.result); reader.readAsDataURL(file);})}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=document.getElementById('list');
  let filtered=files.filter(f=>{
    if(filter!='all'&&filter=='image'&&!f.type.startsWith('image')) return false;
    if(q&&!f.name.toLowerCase().includes(q)) return false;
    return true;
  });
  if(filtered.length==0){list.innerHTML='<div style="text-align:center;padding:60px;color:#64748b">No files yet.<br>Click + ADD</div>'; return;}
  list.innerHTML=filtered.map(f=>`
    <div class="card">
      <img src="${f.data}" onclick="viewFile('${f.id}')">
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="date">${f.date}</div>
        <div class="actions">
          <button class="btn btn-view" onclick="viewFile('${f.id}')">View</button>
          <button class="btn btn-pdf" onclick="singlePDF('${f.id}')">PDF</button>
          <button class="btn btn-down" onclick="saveToGallery('${f.id}')">Save</button>
        </div>
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('t-'+filter).classList.add('active');
}
function viewFile(id){ let f=files.find(x=>x.id==id); if(!f) return; currentViewId=id; document.getElementById('viewerImg').src=f.data; document.getElementById('viewerName').textContent=f.name; document.getElementById('viewer').style.display='flex'; }
function closeViewer(){ document.getElementById('viewer').style.display='none'; }
function saveCurrentToGallery(){ if(currentViewId) saveToGallery(currentViewId); }
function pdfCurrent(){ if(currentViewId) singlePDF(currentViewId); }
async function saveToGallery(id){
  let f=files.find(x=>x.id==id);
  try{
    let res=await fetch(f.data); let blob=await res.blob(); let file=new File([blob], f.name, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:f.name});
      showToast('Choose Save to Gallery - Check Gallery > Downloads');
      return;
    }
  }catch(e){}
  let a=document.createElement('a'); a.href=f.data; a.download=f.name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('照片已保存到相册 - Saved! Check Gallery > Albums > Downloads');
}
function singlePDF(id){
  let f=files.find(x=>x.id==id); const {jsPDF}=window.jspdf; let doc=new jsPDF();
  if(f.type.startsWith('image')){ doc.addImage(f.data,'JPEG',10,10,190,0); doc.text(f.name,10,200); }
  doc.save(f.name.replace(/\.[^/.]+$/,'')+'.pdf');
  showToast('PDF saved to Downloads / PDF folder');
}
function makeAllPDF(){
  let imgs=files.filter(f=>f.type.startsWith('image')); if(imgs.length==0) return showToast('No pictures');
  const {jsPDF}=window.jspdf; let doc=new jsPDF(); imgs.forEach((f,i)=>{ if(i>0) doc.addPage(); doc.addImage(f.data,'JPEG',10,10,190,0); });
  doc.save('Vault_All_Pictures.pdf'); showToast('PDF saved');
}
function showToast(msg){ let t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }
render();
</script>
</body>
</html>
