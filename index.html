<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Vault</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;padding-bottom:80px}
header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
#uploadBtn{background:#3b82f6;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}
#search{width:94%;margin:10px 3%;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;position:relative}
.card img{width:100%;height:140px;object-fit:cover}
.info{padding:6px}
.actions{display:flex;gap:3px;margin-top:4px}
.btn{flex:1;padding:6px;font-size:10px;border:none;border-radius:6px;font-weight:bold}
.btn-view{background:#334155;color:white}
.btn-wa{background:#25D366;color:white}
.btn-save{background:#10b981;color:white}
.btn-del{background:#ef4444;color:white}
#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #334155}
.b-nav{background:none;border:none;color:#94a3b8;font-size:10px;text-align:center}
.b-nav b{display:block;font-size:16px}
#viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:none;flex-direction:column;align-items:center;justify-content:center;padding:15px;z-index:50}
#viewer img{max-width:100%;max-height:50%;border-radius:10px}
#viewerBar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.sbtn{padding:10px 12px;border:none;border-radius:20px;font-weight:bold;font-size:11px}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.lockBox{background:#1e293b;padding:25px;border-radius:20px;width:100%;max-width:320px;text-align:center;border:1px solid #334155}
.lockBox input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;text-align:center}
.lockBtn{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:white;color:black;padding:10px 18px;border-radius:20px;font-size:12px;display:none;z-index:60}
.check{position:absolute;top:5px;left:5px;width:20px;height:20px;background:white;border-radius:50%;display:none;align-items:center;justify-content:center;color:black;font-weight:bold}
.check.show{display:flex}
.check.on{background:#3b82f6;color:white}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lockBox" id="setBox" style="display:none">
    <h3>🔒 Set Password</h3><br>
    <input id="newPass" type="password" placeholder="Create password (4+ chars)">
    <input id="confirmPass" type="password" placeholder="Confirm password">
    <button class="lockBtn" onclick="setPass()">Create & Open Vault</button>
  </div>
  <div class="lockBox" id="enterBox" style="display:none">
    <h3>🔒 Vault Locked</h3><br>
    <input id="enterPass" type="password" placeholder="Enter password">
    <button class="lockBtn" onclick="doUnlock()">Unlock Vault</button>
    <p style="font-size:11px;color:#94a3b8;margin-top:10px">If you forgot password, clear browser data</p>
  </div>
</div>

<header>
<span>🔒 MY VAULT</span>
<button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button>
</header>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none">
<input id="search" placeholder="Search pictures..." oninput="showFiles()">

<div id="list" class="grid"></div>

<div id="viewer">
<img id="vImg" src="">
<p id="vName" style="margin-top:8px;font-size:11px"></p>
<div id="viewerBar">
<button class="sbtn" style="background:#10b981;color:white" onclick="savePic(curId)">💾 Save</button>
<button class="sbtn" style="background:#25D366;color:white" onclick="shareWA(curId)">WhatsApp</button>
<button class="sbtn" style="background:#1877F2;color:white" onclick="shareAny(curId)">Facebook / TikTok</button>
<button class="sbtn" style="background:#ef4444;color:white" onclick="delOne(curId)">🗑️ Delete</button>
<button class="sbtn" style="background:#334155;color:white" onclick="closeV()">Close</button>
</div>
</div>

<div id="toast"></div>

<div id="bottom">
<button class="b-nav" onclick="document.getElementById('fileInput').click()"><b>📤</b>Upload</button>
<button class="b-nav" id="selBtn" onclick="toggleSel()"><b>☑️</b><span id="selTxt">Select</span></button>
<button class="b-nav" id="delBtn" onclick="delSel()" style="display:none"><b>🗑️</b>Delete</button>
<button class="b-nav" id="shareBtn" onclick="shareSel()" style="display:none"><b>💬</b>Share</button>
<button class="b-nav" onclick="printPDF()"><b>🖨️</b>PDF</button>
</div>

<script>
let db, files=[], curId=null, selMode=false, selSet=new Set();
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return h.toString()}
function checkLock(){
 let p=localStorage.getItem('vault_hash');
 if(!p){document.getElementById('lockScreen').style.display='flex';document.getElementById('setBox').style.display='block';document.getElementById('enterBox').style.display='none'}
 else{document.getElementById('lockScreen').style.display='flex';document.getElementById('setBox').style.display='none';document.getElementById('enterBox').style.display='block'}
}
function setPass(){
 let a=document.getElementById('newPass').value,b=document.getElementById('confirmPass').value;
 if(a.length<4)return toast('Use 4+ characters');if(a!==b)return toast('Passwords not match');
 localStorage.setItem('vault_hash',hash(a));document.getElementById('lockScreen').style.display='none';toast('Vault created!')
}
function doUnlock(){
 let p=document.getElementById('enterPass').value;
 if(hash(p)===localStorage.getItem('vault_hash')){document.getElementById('lockScreen').style.display='none';document.getElementById('enterPass').value='';}
 else toast('Wrong password')
}
checkLock();

let req=indexedDB.open('VaultDB',1);
req.onupgradeneeded=e=>{let d=e.target.result; if(!d.objectStoreNames.contains('files')) d.createObjectStore('files',{keyPath:'id'})};
req.onsuccess=e=>{db=e.target.result; load()};
function load(){let tx=db.transaction('files','readonly');let r=tx.objectStore('files').getAll();r.onsuccess=()=>{files=r.result.sort((a,b)=>b.time-a.time);showFiles()}}
function saveObj(o){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(o);tx.oncomplete=()=>load()}
function delObj(id){let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>load()}

document.getElementById('fileInput').addEventListener('change',async e=>{
 for(let f of e.target.files){
  let b=await toBase(f);let c=await compress(b,1000);
  saveObj({id:Date.now()+Math.random()+'',name:f.name,time:Date.now(),data:c})
 }
 toast('Saved!')
});
function toBase(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
function compress(d,maxW){return new Promise(res=>{let i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>maxW){h=h*maxW/w;w=maxW}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(i,0,0,w,h);res(cv.toDataURL('image/jpeg',0.75))};i.src=d})}

function showFiles(){
 let q=document.getElementById('search').value.toLowerCase();
 let filtered=files.filter(f=>!q||f.name.toLowerCase().includes(q));
 let list=document.getElementById('list');
 if(filtered.length==0){list.innerHTML='<div style="text-align:center;padding:40px;color:#64748b">No pictures<br>Tap + ADD to add</div>';return}
 list.innerHTML=filtered.map(f=>{
  let sel=selSet.has(f.id);
  return `<div class="card" onclick="${selMode?`tog('${f.id}')`:`openV('${f.id}')`}">
   <div class="check ${selMode?'show':''} ${sel?'on':''}">${sel?'✓':''}</div>
   <img src="${f.data}">
   <div class="info">
    <div class="actions">
     ${selMode?`<button class="btn ${sel?'btn-del':'btn-view'}" onclick="event.stopPropagation();tog('${f.id}')">${sel?'Selected':'Select'}</button>`:`<button class="btn btn-view" onclick="event.stopPropagation();openV('${f.id}')">View</button><button class="btn btn-wa" onclick="event.stopPropagation();shareWA('${f.id}')">WA</button><button class="btn btn-save" onclick="event.stopPropagation();savePic('${f.id}')">Save</button><button class="btn btn-del" onclick="event.stopPropagation();delOne('${f.id}')">Del</button>`}
    </div>
   </div>
  </div>`
 }).join('')
}

function openV(id){let f=files.find(x=>x.id==id);curId=id;document.getElementById('vImg').src=f.data;document.getElementById('vName').textContent=f.name;document.getElementById('viewer').style.display='flex'}
function closeV(){document.getElementById('viewer').style.display='none'}
function toggleSel(){selMode=!selMode;selSet.clear();document.getElementById('selBtn').innerHTML=selMode?'<b>✕</b><span>Cancel</span>':'<b>☑️</b><span>Select</span>';document.getElementById('delBtn').style.display=selMode?'block':'none';document.getElementById('shareBtn').style.display=selMode?'block':'none';showFiles();if(selMode)toast('Tap pictures to select')}
function tog(id){if(selSet.has(id))selSet.delete(id);else selSet.add(id);showFiles()}
function delOne(id){if(confirm('Delete this picture?')){delObj(id);closeV();toast('Deleted')}}
function delSel(){if(selSet.size==0)return toast('Select first');if(confirm('Delete '+selSet.size+' pictures?')){[...selSet].forEach(id=>delObj(id));selSet.clear();toggleSel();toast('Deleted')}}
function savePic(id){let f=files.find(x=>x.id==id);let w=window.open();w.document.write(`<body style="margin:0;background:#000;color:#fff;text-align:center;font-family:sans-serif"><img src="${f.data}" style="max-width:100%;max-height:80vh"><p>Long press image -> Save image</p><a href="${f.data}" download="${f.name}" style="background:#10b981;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;display:inline-block;margin:10px">Download</a></body>`)}
async function toFile(id){let f=files.find(x=>x.id==id);let r=await fetch(f.data);let b=await r.blob();return new File([b],f.name,{type:b.type})}
async function shareWA(id){try{let file=await toFile(id);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){}toast('Choose WhatsApp after share menu opens');shareAny(id)}
async function shareAny(id){try{let file=await toFile(id);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name})}}catch(e){}}
async function shareSel(){if(selSet.size==0)return toast('Select first');try{let arr=[];for(let id of selSet){arr.push(await toFile(id))}if(navigator.canShare&&navigator.canShare({files:arr})){await navigator.share({files:arr})}}catch(e){}}
function printPDF(){if(files.length==0)return toast('No pictures');let w=window.open();let html=files.map(f=>`<div style="page-break-after:always"><p>${f.name}</p><img src="${f.data}" style="max-width:100%"></div>`).join('');w.document.write(html+`<br><button onclick="window.print()" style="padding:15px;background:orange;border:none;border-radius:10px;font-weight:bold">Print / Save as PDF</button>`)}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
</script>
</body>
</html>
