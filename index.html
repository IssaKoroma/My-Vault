<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Vault</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding-bottom:80px}header{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5} #uploadBtn{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}#search{width:94%;margin:10px 3%;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;position:relative}.card img{width:100%;height:140px;object-fit:cover}.actions{display:flex;gap:3px;margin-top:4px}.btn{flex:1;padding:6px;font-size:10px;border:none;border-radius:6px;font-weight:bold}.btn-view{background:#334155;color:#fff}.btn-wa{background:#25D366;color:#fff}.btn-save{background:#10b981;color:#fff}.btn-del{background:#ef4444;color:#fff}#bottom{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #334155}.b-nav{background:none;border:none;color:#94a3b8;font-size:10px;text-align:center}.b-nav b{display:block;font-size:16px}#viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:15px;z-index:50}#viewer img{max-width:100%;max-height:50%;border-radius:10px}#viewerBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}.sbtn{padding:11px 14px;border:none;border-radius:20px;font-weight:bold;font-size:12px}#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.lockBox{background:#1e293b;padding:25px;border-radius:20px;width:100%;max-width:320px;text-align:center;border:1px solid #334155}.lockBox input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;text-align:center}.lockBtn{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:10px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:20px;font-size:13px;display:none;z-index:60;max-width:90%;text-align:center}.check{position:absolute;top:5px;left:5px;width:20px;height:20px;background:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;color:#000;font-weight:bold}.check.show{display:flex}.check.on{background:#3b82f6;color:#fff}</style></head><body>
<div id="lockScreen"><div class="lockBox" id="setBox" style="display:none"><h3>🔒 Set Password</h3><br><input id="newPass" type="password" placeholder="Create password"><input id="confirmPass" type="password" placeholder="Confirm"><button class="lockBtn" onclick="setPass()">Create & Open</button></div><div class="lockBox" id="enterBox" style="display:none"><h3>🔒 Vault Locked</h3><br><input id="enterPass" type="password" placeholder="Enter password"><button class="lockBtn" onclick="doUnlock()">Unlock</button></div></div>
<header><span>🔒 MY VAULT</span><button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ ADD</button></header>
<input type="file" id="fileInput" multiple accept="image/*" style="display:none"><input id="search" placeholder="Search..." oninput="showFiles()"><div id="list" class="grid"></div>
<div id="viewer"><img id="vImg" src=""><p id="vName" style="margin-top:8px;font-size:11px"></p><div id="viewerBar"><button class="sbtn" style="background:#10b981;color:#fff" onclick="savePic(curId)">💾 Save</button><button class="sbtn" style="background:#25D366;color:#fff" onclick="shareWA(curId)">WhatsApp</button><button class="sbtn" style="background:#1877F2;color:#fff" onclick="shareFB(curId)">Facebook</button><button class="sbtn" style="background:#000;color:#fff;border:1px solid #333" onclick="shareAll(curId)">TikTok</button><button class="sbtn" style="background:#ef4444;color:#fff" onclick="delOne(curId)">🗑️ Delete</button><button class="sbtn" style="background:#334155;color:#fff" onclick="closeV()">Close</button></div></div><div id="toast"></div>
<div id="bottom"><button class="b-nav" onclick="document.getElementById('fileInput').click()"><b>📤</b>Upload</button><button class="b-nav" id="selBtn" onclick="toggleSel()"><b>☑️</b><span id="selTxt">Select</span></button><button class="b-nav" id="delBtn" onclick="delSel()" style="display:none"><b>🗑️</b>Delete</button><button class="b-nav" id="shareBtn" onclick="shareSel()" style="display:none"><b>💬</b>Share</button><button class="b-nav" onclick="printPDF()"><b>🖨️</b>PDF</button></div>
<script>
let db,files=[],curId=null,selMode=false,selSet=new Set();
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return h.toString()}
function checkLock(){let p=localStorage.getItem('vault_hash');if(!p){document.getElementById('lockScreen').style.display='flex';document.getElementById('setBox').style.display='block';document.getElementById('enterBox').style.display='none'}else{document.getElementById('lockScreen').style.display='flex';document.getElementById('setBox').style.display='none';document.getElementById('enterBox').style.display='block'}}function setPass(){let a=document.getElementById('newPass').value,b=document.getElementById('confirmPass').value;if(a.length<4)return toast('4+ chars');if(a!==b)return toast('Not match');localStorage.setItem('vault_hash',hash(a));document.getElementById('lockScreen').style.display='none';toast('Vault created!')}function doUnlock(){let p=document.getElementById('enterPass').value;if(hash(p)===localStorage.getItem('vault_hash')){document.getElementById('lockScreen').style.display='none';document.getElementById('enterPass').value='';}else toast('Wrong password')}checkLock();
let req=indexedDB.open('VaultDB',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};req.onsuccess=e=>{db=e.target.result;load()};function load(){let tx=db.transaction('files','readonly');let r=tx.objectStore('files').getAll();r.onsuccess=()=>{files=r.result.sort((a,b)=>b.time-a.time);showFiles()}}function saveObj(o){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(o);tx.oncomplete=()=>load()}function delObj(id){let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>load()}
document.getElementById('fileInput').addEventListener('change',async e=>{for(let f of e.target.files){let b=await toBase(f);let c=await compress(b,1000);saveObj({id:Date.now()+Math.random()+'',name:f.name,time:Date.now(),data:c})}toast('Saved!')});function toBase(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}function compress(d,maxW){return new Promise(res=>{let i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>maxW){h=h*maxW/w;w=maxW}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(i,0,0,w,h);res(cv.toDataURL('image/jpeg',0.75))};i.src=d})}
function showFiles(){let q=document.getElementById('search').value.toLowerCase();let filtered=files.filter(f=>!q||f.name.toLowerCase().includes(q));let list=document.getElementById('list');if(filtered.length==0){list.innerHTML='<div style="text-align:center;padding:40px;color:#64748b">No pictures<br>Tap + ADD</div>';return}list.innerHTML=filtered.map(f=>{let sel=selSet.has(f.id);return `<div class="card" onclick="${selMode?`tog('${f.id}')`:`openV('${f.id}')`}"><div class="check ${selMode?'show':''} ${sel?'on':''}">${sel?'✓':''}</div><img src="${f.data}"><div class="actions">${selMode?`<button class="btn ${sel?'btn-del':'btn-view'}" onclick="event.stopPropagation();tog('${f.id}')">${sel?'Selected':'Select'}</button>`:`<button class="btn btn-view" onclick="event.stopPropagation();openV('${f.id}')">View</button><button class="btn btn-wa" onclick="event.stopPropagation();shareWA('${f.id}')">WA</button><button class="btn btn-save" onclick="event.stopPropagation();savePic('${f.id}')">Save</button><button class="btn btn-del" onclick="event.stopPropagation();delOne('${f.id}')">Del</button>`}</div></div>`}).join('')}
function openV(id){let f=files.find(x=>x.id==id);curId=id;document.getElementById('vImg').src=f.data;document.getElementById('vName').textContent=f.name;document.getElementById('viewer').style.display='flex'}function closeV(){document.getElementById('viewer').style.display='none'}function toggleSel(){selMode=!selMode;selSet.clear();document.getElementById('selBtn').innerHTML=selMode?'<b>✕</b><span>Cancel</span>':'<b>☑️</b><span>Select</span>';document.getElementById('delBtn').style.display=selMode?'block':'none';document.getElementById('shareBtn').style.display=selMode?'block':'none';showFiles();if(selMode)toast('Tap pictures to select')}function tog(id){if(selSet.has(id))selSet.delete(id);else selSet.add(id);showFiles()}function delOne(id){if(confirm('Delete this picture?')){delObj(id);closeV();toast('Deleted')}}function delSel(){if(selSet.size==0)return toast('Select first');if(confirm('Delete '+selSet.size+'?')){[...selSet].forEach(id=>delObj(id));selSet.clear();toggleSel();toast('Deleted')}}
function dataURLtoFile(dataurl, filename){let arr=dataurl.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]),n=bstr.length,u8arr=new Uint8Array(n);while(n--){u8arr[n]=bstr.charCodeAt(n);}return new File([u8arr],filename,{type:mime});}
async function shareWA(id){let f=files.find(x=>x.id==id);try{let file=dataURLtoFile(f.data,f.name);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.n
